# OpenAPI description of the Neural Canvas API.
#
# Hand-written rather than generated. Generating it from Go annotations would keep
# it mechanically in step with the handlers, but it would also only ever describe
# what the code does -- and a description that cannot disagree with the
# implementation cannot document an intent either. The error codes below, for
# instance, are a contract clients branch on; writing them out is what makes
# changing one visibly a breaking change rather than a rename.
#
# The risk with a hand-written spec is that it rots. handler/openapi_test.go is the
# answer: it walks the real router and fails if an endpoint exists that is not
# described here, or if something described here does not resolve to a route. So
# this file cannot silently drift from the code -- only deliberately.
openapi: 3.0.3

info:
  title: Neural Canvas API
  version: "1.0.0"
  description: |
    A social image gallery where posts are generated by DALL·E 3.

    **Authentication.** Every endpoint except `/healthz`, `/readyz`, `/signup` and
    `/signin` requires a bearer token from `/signin`. Tokens are HS256 JWTs valid
    for 24 hours, and are additionally checked against a per-user revocation
    timestamp on every request, so `/signout` takes effect immediately rather than
    at expiry.

    **Errors.** Every failure has the same shape, with a stable `code` a client can
    branch on and a `message` that may be reworded at any time. Never branch on
    `message`.

    **Request ids.** Every response carries `X-Request-Id`, and failures repeat it
    in the body. It appears in every server log line for that request, so quoting
    it is enough to find what happened.
  license:
    name: MIT
    url: https://github.com/luc1ferxx/neural-canvas/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local, including the docker compose stack

tags:
  - name: Authentication
  - name: Posts
  - name: Probes

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Probes]
      summary: Liveness
      description: |
        Answers as long as the process is running. Deliberately checks no
        dependency: a liveness probe that fails because Elasticsearch is down
        causes restarts that cannot fix Elasticsearch, turning one broken
        dependency into a crash-looping service.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /readyz:
    get:
      tags: [Probes]
      summary: Readiness
      description: |
        Reports whether this instance can serve traffic, which means checking
        Elasticsearch. Returns 503 rather than 500 when it cannot: 503 tells a load
        balancer to send traffic elsewhere, while 500 describes a request that
        failed.
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        "503":
          $ref: "#/components/responses/Unavailable"

  /signup:
    post:
      tags: [Authentication]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: The account was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username:
                    type: string
                    example: ada
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            The username is taken (`user_exists`). A distinct code rather than a
            second `invalid_request`, because "username taken" and "password too
            short" are both client errors and the client needs to know which field
            to highlight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /signin:
    post:
      tags: [Authentication]
      summary: Exchange credentials for a token
      description: |
        Failed attempts are counted per username in Elasticsearch, so the throttle
        is shared across instances. If that counter is unreadable the request
        proceeds rather than being refused: failing open here risks brute-force
        attempts that still have to pass the credential check, whereas failing
        closed would lock every user out during an Elasticsearch blip.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: Authenticated.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: HS256 JWT, valid for 24 hours.
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkYSJ9.sig
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Wrong username or password (`unauthorized`). One code and one message
            for both, deliberately: distinguishing them would confirm which
            usernames exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts for this username (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /signout:
    post:
      tags: [Authentication]
      summary: Revoke this user's sessions
      description: |
        Records a revocation timestamp for the user, which invalidates every token
        issued before now -- not only the one presented. Signing out of one browser
        signs out of all of them. That is a deliberate trade: per-token revocation
        would need a token id and a store of them, and the common reason to sign
        out is a device you no longer trust.
      responses:
        "200":
          description: Every existing token for this user is now refused.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /upload:
    post:
      tags: [Posts]
      summary: Upload media as a post
      description: |
        The post type is decided by sniffing the bytes, never by the filename or the
        client's `Content-Type`. Every object in the bucket is publicly readable, so
        a client naming an HTML page `cat.jpg` would otherwise get a hostable page
        on the project's domain.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [media_file]
              properties:
                media_file:
                  type: string
                  format: binary
                  description: At most 32 MiB. JPEG, PNG, GIF, WebP, MP4, WebM, AVI, QuickTime, FLV or WMV.
                message:
                  type: string
                  description: Caption. Optional.
      responses:
        "200":
          $ref: "#/components/responses/PostCreated"
        "400":
          description: |
            No `media_file` part, or it exceeded 32 MiB (`invalid_request`). The size
            case arrives here rather than as a 413 because the limit is enforced by
            capping the reader, which surfaces as a malformed multipart body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: The sniffed content type is not allowed (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /generate:
    post:
      tags: [Posts]
      summary: Generate an image from a prompt and save it as a post
      description: |
        Calls DALL·E 3 server-side, validates the returned bytes against the same
        allowlist as an upload, stores the image and indexes the post.

        Capped at 20 generations per user per day. The cap is checked *before* the
        provider call, and if the quota store is unreachable the request is refused
        rather than allowed: failing open on a spending limit would turn an
        Elasticsearch outage into an unbounded OpenAI bill.

        Typically takes 10-30 seconds. Once the provider has been billed, the
        storage and index writes continue even if the client hangs up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: a lighthouse in a storm, oil painting
      responses:
        "200":
          $ref: "#/components/responses/PostCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: The caller's daily generation quota is spent (`quota_exceeded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The provider failed, or its image could not be stored (`upstream_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            The remaining quota could not be checked (`unavailable`), so the request
            was refused without calling the provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /search:
    get:
      tags: [Posts]
      summary: Search posts
      description: |
        All filters are optional and combine. Paging is offset-based, which degrades
        past roughly 10,000 results; a `search_after` cursor would be needed beyond
        that.

        Invalid `from`, `size` and `type` values are clamped or ignored rather than
        rejected, so a stale client cannot turn a bad parameter into a failed search.
      parameters:
        - name: user
          in: query
          description: Exact username.
          schema:
            type: string
        - name: keywords
          in: query
          description: Full-text match against the post caption.
          schema:
            type: string
        - name: type
          in: query
          description: Unrecognised values are ignored rather than rejected.
          schema:
            type: string
            enum: [image, video]
        - name: from
          in: query
          description: Offset. Negative and unparseable values fall back to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Page size, clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching posts, `[]` when there are none rather than `null`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /post/{id}:
    delete:
      tags: [Posts]
      summary: Delete a post and its stored media
      description: |
        Ownership is enforced by matching id **and** user, so one user cannot delete
        another's post. A post that does not exist and a post belonging to someone
        else are both 404, which is what keeps the endpoint from confirming that
        another user's post id is real.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The post and its object are gone.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such post owned by this user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>` using a token from `/signin`. Validated for
        signature and expiry, and then checked against the user's revocation
        timestamp -- so a signature that verifies is not sufficient.

  headers:
    XRequestId:
      description: |
        Echoes an inbound `X-Request-Id` when one was supplied, and is generated
        otherwise. An inbound value is accepted only if it is at most 64 characters
        of alphanumerics, dashes and underscores: a value containing a newline could
        forge entries in a line-oriented log.
      schema:
        type: string
        maxLength: 64

  schemas:
    Post:
      type: object
      required: [id, user, message, url, type]
      properties:
        id:
          type: string
          format: uuid
        user:
          type: string
        message:
          type: string
          description: The caption, or the prompt for a generated post.
        url:
          type: string
          format: uri
          description: |
            Publicly readable storage URL. The browser loads it directly, so image
            bytes never pass through this API on the way out.
        type:
          type: string
          enum: [image, video]
          description: Derived from the bytes, not from the filename or the declared type.

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_-]{3,32}$"
          example: ada
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: The maximum is 72 because bcrypt silently truncates beyond it.
        age:
          type: integer
          format: int64
        gender:
          type: string

    SigninRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    Error:
      type: object
      required: [error]
      description: |
        Nested under `error` rather than flattened so a success payload can never be
        mistaken for a failure: a post has a `message` field of its own, which a
        flat `{"message": ...}` would collide with.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable and safe to branch on.
              enum:
                - invalid_request
                - unauthorized
                - session_revoked
                - forbidden
                - not_found
                - user_exists
                - unsupported_media_type
                - payload_too_large
                - rate_limited
                - quota_exceeded
                - internal
                - upstream_failed
                - unavailable
            message:
              type: string
              description: Human-readable, and reworded freely. Never branch on it.
            request_id:
              type: string
              description: Matches the `X-Request-Id` header and the server logs.

  responses:
    BadRequest:
      description: The request could not be understood (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: |
        Missing, malformed or expired token (`unauthorized`), or a token issued
        before this user signed out (`session_revoked`). The two are distinct codes
        so a client can tell "sign in again" from "your credentials were rejected".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unavailable:
      description: A dependency is unreachable (`unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Internal:
      description: |
        An unexpected server-side failure (`internal`). The message is deliberately
        generic; the cause is in the logs under the request id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PostCreated:
      description: The post was stored and indexed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Post"
