server {
    # 3000 to match the port the dev server uses, so ALLOWED_ORIGINS and any
    # bookmarked URL work the same against either.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so these can be cached indefinitely.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached: it is the file that names the current hashed
    # bundles, so a stale copy pins the browser to a deployment that no longer
    # exists and produces 404s for assets rather than an obvious failure.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: the router owns the path space, so any unknown path has to
    # be served index.html rather than a 404. Without this, reloading the page on
    # /search or following a deep link fails while in-app navigation to the same
    # route works -- a bug that only ever shows up outside the dev server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
